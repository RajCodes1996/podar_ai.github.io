<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podar A.I ChatBot</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            font-family: "Inter", sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN CHAT BOX */
        .chat-wrapper {
            width: 100%;
            max-width: 850px;
            height: 92vh;
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 18px #00000080;
            position: relative;
        }

        /* 3D Logo */
        .logo {
            width: 70px;
            position: absolute;
            right: 15px;
            top: 10px;
            filter: drop-shadow(0 0 8px #00c6ff);
            transform: perspective(400px) translateZ(20px);
            animation: softPulse 3s infinite ease-in-out;
        }

        @keyframes softPulse {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 6px #00c6ff);
            }

            50% {
                transform: scale(1.06);
                filter: drop-shadow(0 0 14px #00ffff);
            }

            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 6px #00c6ff);
            }
        }

        /* HEADING */
        .header {
            text-align: center;
            padding: 20px;
            font-size: 28px;
            font-weight: 900;
            color: white;
            background: #121212;
            letter-spacing: 2px;
            text-shadow: 0 0 6px cyan, 0 0 20px #008cff;
            border-bottom: 1px solid #1f1f1f;
        }

        /* SUB HEADING */
        .sub-header {
            text-align: center;
            color: #00c6ff;
            letter-spacing: 4px;
            margin-top: -10px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        /* Developer Tag */
        .developer {
            text-align: center;
            color: whitesmoke;
            font-size: 13px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        /* CHAT OUTPUT */
        .chat-output {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            scroll-behavior: smooth;
            background: #101010;
        }

        /* CHAT MESSAGE STYLES */
        .msg {
            max-width: 78%;
            padding: 14px 18px;
            margin-bottom: 15px;
            border-radius: 14px;
            font-size: 16px;
            line-height: 1.6;
            background: #1b1b1b;
            color: #ddd;
        }

        .user {
            background: #1e3a8a;
            color: #fff;
            margin-left: auto;
            border-radius: 14px 14px 4px 14px;
        }

        .bot {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px 14px 14px 4px;
        }

        .bot img {
            width: 240px;
            border-radius: 10px;
            margin-top: 8px;
            border: 2px solid #333;
        }

        /* INPUT AREA */
        .input-area {
            display: flex;
            padding: 18px;
            background: #111;
            border-top: 1px solid #1f1f1f;
        }

        .input-area input {
            flex: 1;
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 40px;
            color: white;
            font-size: 17px;
            outline: none;
        }

        .send-btn {
            margin-left: 12px;
            background: #bbc6d8;
            padding: 0 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        .send-btn:hover {
            background: #60a5fa;
        }

        /* Typing Animation */
        .typing {
            width: 40px;
            display: flex;
            gap: 5px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 100% { opacity: .2 }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        /* RESPONSIVE LOGO */
        @media (max-width: 900px) {
            .logo { width: 65px; }
        }

        @media (max-width: 600px) {
            .logo { width: 55px; }
        }

        @media (max-width: 420px) {
            .logo { width: 45px; }
        }

        .mic-btn {
    width: 48px;
    height: 48px;
    border: none;
    background: #4b69ff;
    color: white;
    font-size: 22px;
    border-radius: 50%;
    cursor: pointer;
    margin-left: 6px;
    transition: 0.3s;
}

.mic-btn.listening {
    background: #ff3b30;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

    </style>
</head>

<body>

    <div class="chat-wrapper">

        <!-- Logo -->
        <img src="images/podar_logo.png" class="logo">

        <div class="header">Podar A.I</div>
        <div class="sub-header">Podar Namaskar!</div>
        <div class="developer"><i>Developed by @Rajarshi-Yadav</i></div>

        <div class="chat-output" id="chatOutput"></div>

        <div class="input-area">
            <input id="userInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()">
            <div class="send-btn" onclick="sendMessage()">➤</div>

            <button id="micBtn" class="mic-btn">
    🎤
</button>

        </div>
    </div>

  <script>

function sendMessage() {
    let input = document.getElementById("userInput");
    let text = input.value.trim();
    if (!text) return;

    let output = document.getElementById("chatOutput");

    // User bubble
    output.innerHTML += `<div class='msg user'>${text}</div>`;
    input.value = "";

    // Typing animation
    let typing = document.createElement("div");
    typing.className = "msg bot";
    typing.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    output.appendChild(typing);
    output.scrollTop = output.scrollHeight;

    setTimeout(() => {
        typing.remove();
        generateBotReply(text);
    }, 700);
}

/* MAIN BOT REPLY */
function generateBotReply(text) {
    const output = document.getElementById("chatOutput");
    const replyContainer = document.createElement("div");
    replyContainer.className = "msg bot";

    let lower = text.toLowerCase();

    /* 1️⃣ MAP DETECTION FIRST */
    if (
        lower.includes("location") ||
        lower.includes("school map") ||
        lower.includes("podar location") ||
        lower.includes("navigate") ||
        lower.includes("directions") ||
        lower.includes("how to reach")
    ) {
        replyContainer.innerHTML = `
            <div>Here is the school location:</div>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4390.206796279784!2d79.9688281759145!3d23.138932011974752!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3981ad495ebc1129%3A0x20d0ecc6c37f1c33!2sPodar%20International%20School%2C%20Jabalpur!5e1!3m2!1sen!2sin!4v1764179965332!5m2!1sen!2sin"
                width="100%" 
                height="260" 
                style="border:0; margin-top:10px; border-radius:12px;"
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        `;
        output.appendChild(replyContainer);
        output.scrollTop = output.scrollHeight;

        speakText("Here is the school location on Google Maps.");  // 🔊 voice added
        return;
    }

    /* 2️⃣ IMAGE DETECTION */
    const imageReply = detectImage(lower);
    if (imageReply) {
        replyContainer.innerHTML = `
            <div>Here is the image you requested:</div>
            <img src="${imageReply}" style="max-width:90%; border-radius:12px; margin-top:8px;">
        `;
        output.appendChild(replyContainer);
        output.scrollTop = output.scrollHeight;

        speakText("Here is the image you requested."); // 🔊 voice added
        return;
    }

    /* 3️⃣ NORMAL TEXT REPLY */
    let reply = botReply(lower);
    replyContainer.innerHTML = `<span class="botText"></span>`;
    output.appendChild(replyContainer);

    typeWriterEffect(reply, replyContainer.querySelector(".botText"));
}


/* IMAGE HANDLING */
function detectImage(text) {
    if (text.includes("cat")) return "images/cat.jpg";
    if (text.includes("dog")) return "images/dog.jpg";
    if (text.includes("podar logo")) return "images/podar_logo.png";
    if (text.includes("school image")) return "images/podar_img.jpg";
    return null;
}


/* TYPEWRITER EFFECT + VOICE */
function typeWriterEffect(text, element) {
    let i = 0;

    function type() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            setTimeout(type, 18);
        } else {
            speakText(text); // 🔊 voice AFTER typing finishes
        }
    }
    type();
}

/* TEXT-BASED BOT RESPONSES */
function botReply(userText) {
    if (userText.includes("hello") || userText.includes("hi"))
        return "Podar Namaskar! How can I assist you today?";

    if (userText.includes("about school"))
        return "Podar International School, founded in 1927, is a trusted education network with 150+ schools, offering value-based, modern, and holistic learning.";

    if (userText.includes("timing"))
        return "School timings at Podar are 8:00 AM to 2:00 PM.";

    return "Thank you for your question! I will get more information shortly.";
}

/* 🔊 TEXT-TO-SPEECH */
function speakText(text) {
    speechSynthesis.cancel(); // stop old speech

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    speechSynthesis.speak(utterance);
}

</script>

 </body>
</html>
